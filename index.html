<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>케어루프 (CareLoop)</title>
    <style>
        :root { --bg: #FFFFFF; --ink: #000000; --ink-soft: #555555; --fill-soft: #F2F2F2; }
        body { font-family: sans-serif; margin: 0; padding: 40px 20px; background: var(--bg); color: var(--ink); }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid var(--ink); padding: 30px; }
        h1 { margin-top: 0; font-size: 28px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid var(--ink); box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        button { width: 100%; background: var(--ink); color: #FFF; padding: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 25px; padding: 15px; border: 1px solid var(--ink); background: var(--fill-soft); display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>케어루프 (CareLoop)</h1>
    <p style="color: var(--ink-soft);">오늘의 복약과 재활 운동 상태를 기록해 주세요.</p>

    <form id="careForm">
        <div class="form-group checkbox-group">
            <input type="checkbox" id="medicationTaken" checked>
            <label for="medicationTaken" style="margin-bottom:0;">오늘 약을 처방대로 복용했나요?</label>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="exerciseCompleted" checked>
            <label for="exerciseCompleted" style="margin-bottom:0;">오늘 목표한 재활 운동을 수행했나요?</label>
        </div>

        <div class="form-group">
            <label for="painScore">오늘 느끼는 통증 점수 (0: 없음 ~ 10: 극심함)</label>
            <input type="number" id="painScore" min="0" max="10" value="2">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="warningSymptoms">
            <label for="warningSymptoms" style="margin-bottom:0;">수술 부위 진물, 발열 등 이상 징후가 있나요?</label>
        </div>

        <div class="form-group">
            <label for="notes">특이사항 및 메모</label>
            <textarea id="notes" rows="3" placeholder="운동 시 느낀 점을 적어주세요."></textarea>
        </div>

        <button type="button" onclick="submitRecord()">오늘 기록 등록하기</button>
    </form>

    <div id="resultBox" class="result-box">
        <div id="resultMessage"></div>
    </div>
</div>

<script>
function submitRecord() {
    const pain = parseInt(document.getElementById('painScore').value);
    const warning = document.getElementById('warningSymptoms').checked;
    const resultBox = document.getElementById('resultBox');
    const resultMessage = document.getElementById('resultMessage');

    resultBox.style.display = 'block';

    if (warning || pain >= 7) {
        resultMessage.innerText = "⚠️ 주의: 통증이 심하거나 부작용 징후가 있습니다. 무리한 운동을 중단하고 병원 진료를 받으세요.";
    } else if (pain >= 4) {
        resultMessage.innerText = "⚡ 참고: 통증 수치가 약간 높습니다. 운동 강도를 낮추고 경과를 관찰하세요.";
    } else {
        resultMessage.innerText = "정상적으로 기록되었습니다. 내일도 재활을 이어가세요!";
    }
}
</script>

</body>
</html>
